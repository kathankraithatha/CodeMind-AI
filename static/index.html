<!doctype html>
<html lang="en" data-theme="dark">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="AI-powered code analysis, architecture visualization, and optimization tool powered by Google Gemini"
        />
        <title>CodeMind AI</title>
        <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
        <link
            rel="preconnect"
            href="https://cdnjs.cloudflare.com"
            crossorigin
        />
        <link rel="preconnect" href="https://unpkg.com" crossorigin />
        <link rel="stylesheet" href="/static/style.css" />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css"
            id="hljs-theme"
        />
        <script
            defer
            src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"
        ></script>
        <script
            defer
            src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"
        ></script>
        <script defer src="https://unpkg.com/lucide@0.344.0"></script>
    </head>
    <body>
        <header>
            <div class="header-title">
                <i data-lucide="hexagon"></i> CodeMind AI
            </div>
            <select id="action-select">
                <button><selectedcontent></selectedcontent></button>
                <option>Explain Code</option>
                <option>Optimize Code</option>
                <option>Find Bugs</option>
                <option>Visualize Architecture</option>
            </select>
            <select id="level-select">
                <button><selectedcontent></selectedcontent></button>
                <option>Beginner</option>
                <option>Intermediate</option>
                <option>Expert</option>
            </select>
            <select id="lang-select">
                <button><selectedcontent></selectedcontent></button>
                <option>Auto-detect</option>
                <option>Python</option>
                <option>JavaScript</option>
                <option>TypeScript</option>
            </select>
            <select id="theme-select">
                <button><selectedcontent></selectedcontent></button>
                <option value="dark">Dark</option>
                <option value="light">Light</option>
            </select>
        </header>

        <main>
            <div class="left-panel">
                <div class="panel-header">
                    <span class="panel-title"
                        ><i data-lucide="code"></i> Input Code</span
                    >
                    <label class="agent-mode">
                        Agent Mode
                        <input type="checkbox" id="agent-mode-toggle" />
                        <div class="toggle-switch"></div>
                    </label>
                    <button class="run-btn" id="run-btn">
                        <i data-lucide="play"></i> Run Analysis
                    </button>
                </div>
                <div class="url-input-container">
                    <i data-lucide="link"></i>
                    <input
                        type="text"
                        id="repo-url-input"
                        placeholder="Optional: GitHub repo URL or raw file link..."
                    />
                </div>
                <textarea
                    id="code-input"
                    placeholder="write code here..."
                ></textarea>
            </div>

            <div class="right-panel">
                <div class="panel-header">
                    <span class="panel-title"
                        ><i data-lucide="terminal"></i> Results</span
                    >
                    <button
                        class="icon-btn"
                        id="tab-output-btn"
                        title="View Code Analysis"
                    >
                        <i data-lucide="code"></i> Analysis
                    </button>
                    <button
                        class="icon-btn"
                        id="tab-diagram-btn"
                        title="View Architecture Diagram"
                    >
                        <i data-lucide="image"></i> Diagram
                    </button>
                    <button
                        class="icon-btn"
                        id="tab-raw-btn"
                        title="View Raw Markdown"
                    >
                        <i data-lucide="file-text"></i> Raw
                    </button>
                    <button
                        class="icon-btn"
                        id="copy-btn"
                        title="Copy Current View"
                    >
                        <i data-lucide="copy"></i> Copy
                    </button>
                </div>

                <div
                    id="analysis-container"
                    style="
                        display: flex;
                        flex: 1;
                        flex-direction: column;
                        overflow: hidden;
                        position: relative;
                    "
                >
                    <div
                        style="
                            display: flex;
                            justify-content: flex-end;
                            gap: 0.5rem;
                            padding: 0.5rem 1.5rem 0;
                            flex: none;
                            box-sizing: border-box;
                        "
                    >
                        <button
                            class="icon-btn"
                            id="regenerate-analysis-btn"
                            style="display: none"
                            title="Regenerate Analysis"
                        >
                            <i data-lucide="refresh-cw"></i> Regenerate
                        </button>
                    </div>
                    <div
                        id="analysis-output"
                        class="markdown-body"
                        style="flex: 1; padding: 1.5rem; overflow-y: auto"
                    >
                        <div class="placeholder-text">
                            analysis here<br />with scroll down and up
                        </div>
                    </div>
                </div>

                <div
                    id="diagram-container"
                    style="
                        display: none;
                        flex: 1;
                        padding: 1.5rem;
                        flex-direction: column;
                        align-items: center;
                        overflow-y: auto;
                        position: relative;
                    "
                >
                    <div
                        style="
                            width: 100%;
                            display: flex;
                            justify-content: flex-end;
                            gap: 0.5rem;
                            margin-bottom: 0.5rem;
                            flex: none;
                        "
                    >
                        <button
                            class="icon-btn"
                            id="regenerate-diagram-btn"
                            style="display: none"
                            title="Regenerate Architecture Image"
                        >
                            <i data-lucide="refresh-cw"></i> Regenerate
                        </button>
                        <button
                            class="icon-btn"
                            id="download-img-btn"
                            style="
                                display: none;
                                color: var(--hl-color);
                                border: 1px solid var(--hl-color);
                                background: rgba(0, 0, 0, 0.2);
                            "
                            title="Download Architecture Image"
                        >
                            <i data-lucide="download"></i> Download Image
                        </button>
                    </div>
                    <div
                        id="diagram-placeholder"
                        style="
                            display: flex;
                            flex-direction: column;
                            align-items: center;
                            margin-top: 4rem;
                        "
                    >
                        <p
                            style="
                                color: var(--text-muted);
                                margin-bottom: 1rem;
                            "
                        >
                            No diagram generated yet.
                        </p>
                        <button
                            class="run-btn"
                            id="generate-diagram-btn"
                            style="flex: none; width: auto"
                        >
                            <i data-lucide="image-plus"></i> Generate AI Diagram
                        </button>
                    </div>
                    <div
                        id="diagram-output"
                        class="markdown-body"
                        style="width: 100%; margin-top: 1rem"
                    ></div>
                </div>

                <textarea id="raw-output" readonly></textarea>
            </div>
        </main>

        <button id="floating-chat-btn">
            <i data-lucide="message-square"></i> Chat
        </button>

        <div id="sidebar-overlay"></div>
        <div id="chat-sidebar">
            <div class="chat-header">
                <span><i data-lucide="bot"></i> Agent Chat</span>
                <span class="close-btn" id="close-chat-btn"
                    ><i data-lucide="x"></i
                ></span>
            </div>
            <div class="chat-messages" id="chat-messages"></div>
            <div class="chat-input-container">
                <input
                    type="text"
                    id="chat-input"
                    placeholder="Ask about code..."
                    autocomplete="off"
                />
                <button id="send-btn"><i data-lucide="send"></i></button>
            </div>
        </div>

        <script defer src="/static/script.js"></script>
    </body>
</html>
